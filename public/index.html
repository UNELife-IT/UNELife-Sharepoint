<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UNE LIFE IT Library</title>
<style>
  :root {
    --brand: #1b7a3d;
    --brand-dark: #115228;
    --accent: #a6e22e;
    --bg: #f4f8f4;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #5f6f64;
    --border: #dce6dd;
    --nav-h: 60px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  /* NAV BAR */
  nav {
    position: sticky; top: 0; z-index: 100;
    height: var(--nav-h);
    background: var(--brand);
    color: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .brand { font-weight: 700; font-size: 1.05rem; white-space: nowrap; text-decoration: none; color: #fff; }
  .brand span { color: var(--accent); }
  .nav-link {
    color: #dff5e4; text-decoration: none; font-size: .88rem; white-space: nowrap;
    padding: 8px 12px; border-radius: 6px; transition: background .15s, color .15s;
  }
  .nav-link:hover { background: var(--brand-dark); color: #fff; }

  /* HEADER */
  header.hero {
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    color: #fff; padding: 48px 24px 56px; text-align: center;
  }
  header.hero h1 { margin: 0 0 8px; font-size: 2rem; }
  header.hero p { margin: 4px 0; color: #dff5e4; }

  /* CONTROLS */
  .controls { max-width: 900px; margin: 36px auto 20px; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  #search {
    width: 100%; padding: 12px 16px; font-size: 1rem; border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #search:focus { outline: 2px solid var(--accent); border-color: var(--brand); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button {
    background: var(--card); border: 1px solid var(--border); color: var(--brand-dark);
    padding: 6px 14px; border-radius: 20px; font-size: .88rem; cursor: pointer;
  }
  .filters button:hover { border-color: var(--brand); }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #12300a; font-weight: 600; }

  /* ARTICLE LIST */
  main { max-width: 900px; margin: 0 auto 40px; padding: 0 20px; }
  .count { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .articles { display: grid; gap: 16px; }
  .article {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    transition: border-color .15s, box-shadow .15s;
  }
  .article:hover { border-color: var(--brand); box-shadow: 0 3px 10px rgba(0,0,0,.08); }
  .article h2 { margin: 0 0 6px; font-size: 1.2rem; color: var(--brand); }
  .article p { margin: 0 0 10px; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
  .tag { background: #e3f4d0; color: var(--brand-dark); padding: 2px 10px; border-radius: 12px; }
  #empty { text-align: center; color: var(--muted); padding: 20px; display: none; }

  footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 20px; }

  @media (max-width: 600px) {
    nav { padding: 0 16px; }
    .controls, main { padding: 0 16px; }
    .article { padding: 18px; }
  }
</style>
</head>
<body>
<nav>
<a class="brand" href="./">UNE <span>LIFE</span> | IT Library</a>
<a class="nav-link" href="upload.html">Upload a guide</a>
</nav>
<header class="hero">
<h1>UNE LIFE IT Library</h1>
<p>Guides and articles for UNE LIFE staff</p>
</header>
<div class="controls">
<input id="search" placeholder="Search articles..." type="search"/>
<div class="filters" id="filters"></div>
</div>
<main>
<p class="count" id="count"></p>
<div class="articles" id="articles"></div>
<p id="empty">No articles match your search.</p>
</main>
<footer>UNE LIFE IT Support · IT Library</footer>
<script>
  const list = document.getElementById('articles');
  const filters = document.getElementById('filters');
  const search = document.getElementById('search');
  const count = document.getElementById('count');
  const empty = document.getElementById('empty');
  let articles = [];
  let category = 'All';

  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function render() {
    const q = search.value.trim().toLowerCase();
    const shown = articles.filter(a =>
      (category === 'All' || a.category === category) &&
      (!q || [a.title, a.summary, a.category].join(' ').toLowerCase().includes(q))
    );
    list.innerHTML = shown.map(a => `
      <a class="article" href="articles/${encodeURIComponent(a.file)}">
        <h2>${escapeHtml(a.title)}</h2>
        <p>${escapeHtml(a.summary)}</p>
        <div class="meta">
          ${a.category ? `<span class="tag">${escapeHtml(a.category)}</span>` : ''}
          ${a.date ? `<span>${escapeHtml(formatDate(a.date))}</span>` : ''}
        </div>
      </a>`).join('');
    count.textContent = `${shown.length} of ${articles.length} article${articles.length === 1 ? '' : 's'}`;
    empty.style.display = shown.length ? 'none' : 'block';
  }

  function renderFilters() {
    const cats = ['All', ...new Set(articles.map(a => a.category).filter(Boolean))];
    filters.innerHTML = cats.map(c =>
      `<button type="button" class="${c === category ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');
  }

  filters.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    category = btn.dataset.cat;
    renderFilters();
    render();
  });
  search.addEventListener('input', render);

  fetch('articles/articles.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(data => {
      articles = data.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      renderFilters();
      render();
    })
    .catch(() => { count.textContent = 'Could not load the article list.'; });
</script>
</body>
</html>
